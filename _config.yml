# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
locale: en-GB
title: "Pablo Capilla-Lasheras"
masthead_title: "Pablo Capilla-Lasheras research group"
subtitle:
email: pacapilla@gmail.com
description: "Behavioural ecology, migration and evolution in human-altered environments."
url: "https://pablocl.com"
baseurl: ""
twitter_username: p_capi
github_username: PabloCapilla
minimal_mistakes_skin: default
search: false

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

exclude:
  - AGENTS.md
  - readme.md
  - scraps/

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Pablo Capilla-Lasheras"
  avatar : "/assets/images/bio/20230610-profile-00042.jpeg"
  bio    : "Ramón y Cajal Fellow at Rey Juan Carlos University, Madrid."
  links:
    - label: "Google Scholar Profile"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=5JMTO-kAAAAJ&hl=en"
    - label: "Bluesky"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://bsky.app/profile/pcapi.bsky.social"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/PabloCapilla"
    - label: "E-mail"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto: pacapilla@gmail.com"

footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=5JMTO-kAAAAJ&hl=en"
    - label: "Bluesky"
      icon: "fas fa-fw fa-link"
      url: "https://bsky.app/profile/pcapi.bsky.social"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/PabloCapilla"
    - label: "E-mail"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto: pacapilla@gmail.com"
    - label: "MIGRALIGHT Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/migralight/"


defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: true
      related: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
