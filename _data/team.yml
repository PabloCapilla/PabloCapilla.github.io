current:
  - name: "Pablo Capilla-Lasheras"
    pronouns: "he/his"
    role: "Group leader · Ramón y Cajal Fellow"
    institution: "Global Change Research Institute · Rey Juan Carlos University, Madrid"
    description: "Evolutionary ecologist studying how animals respond to human-induced environmental change, with a particular focus on migration, urbanisation and biological rhythms."
    image: "/assets/images/bio/20230610-profile-00042.jpeg"
    alt: "Portrait of Pablo Capilla-Lasheras"
    profile_url: "/bio/"
  - name: "Alejandro Molinero"
    pronouns:
    role: "MSc student"
    institution: "Pablo de Olavide University"
    supervision: "Co-supervised with Blanca Jimeno"
    description: "Ale is investigating whether epigenetic potentail could explain biological success in urban habitats. He is using genomics to quantify epigenetic potential in urban and non-urban populations of scops owl across Iberia"
  - name: "Lucas Pelta"
    pronouns:
    role: "MSc student"
    institution: "University of Granada"
    supervision: "Co-supervised with Juan Diego Ibáñez-Álamo"
    description: "Lucas is employing different technology (e.g., passive acoustic monitoring) and citizen sciene to detect non-migratory scops owls, with the final aim of determining if migratory drop off in the species is associated with living in human-altered habitats."
    image: "/assets/images/team/Lucas_Pelta.jpeg"
  
