  image: ""
- name: "Pablo Capilla-Lasheras"
  pronouns: "he/his"
  role: "Group leader · Ramón y Cajal Fellow"
  institution: "Global Change Research Institute · Rey Juan Carlos University, Madrid"
  description: "Evolutionary ecologist studying how animals respond to human-induced environmental change, with a particular focus on migration, urbanisation and biological rhythms."
  image: "/assets/images/team/portraits/pablo-capilla-lasheras.jpg"
  alt: "Portrait of Pablo Capilla-Lasheras"
  profile_url: "/bio/"
- name: "Patricia García Florencio"
  role: "BSc student"
  institution: "Rey Juan Carlos University"
  description: "When adaptive to do so, bird females might have the ability to modulate size hierarchies within broods. For my BSc thesis, I am investigating whether urbanisation is associated with increased within-brood variation in growth and whether this might reflect a female strategy to optimise reproductive output in urban environments."
  image: "/assets/images/team/portraits/patricia-garcia-florencio.jpg"
  alt: "Portrait of Patricia García Florencio outdoors beneath a tree"
- name: "Valentina Kaid Soto"
  role: "MSc student"
  institution: "University of Granada"
  supervision: "Co-supervised with Juan Diego Ibañez-Álamo"
  description: "I am investigating the environmental factors associated with resident behaviour in the Eurasian scops owl (Otus scops), a species that shows considerable variation in migratory behaviour. To this end, I am using species distribution models based on data from professional surveys and citizen science."
  image: "/assets/images/team/portraits/valentina-kaid-soto.jpg"
  alt: "Portrait of Valentina Kaid Soto in a mountain landscape"
- name: "Vera García Pérez"
  role: "MSc student"
  institution: "University of Granada"
  supervision: "Co-supervised with Juan Diego Ibañez-Álamo"
  description: "I am investigating the moulting strategy of the European scops owl (Otus scops) using stable hydrogen and sulphur isotope analysis of feathers, and whether stable isotope analysis (SIA) can be used to determine the migratory strategy of scops owls. Combining individual migratory tracks and SIA, I am aiming to develop a method that can be applied to categorise migratory behaviour at a large scale."
  image: "/assets/images/team/portraits/vera-garcia-perez.jpg"
  alt: "Portrait of Vera García Pérez in a sunlit natural landscape"

